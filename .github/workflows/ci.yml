# TermFlow CI(T13.1, CR-13). 로컬 종료 게이트(TODO 원칙 1)의 자동 실행분을 GitHub Actions(ubuntu)로 돌린다.
#
#   lint        pnpm lint(eslint·prettier·check:no-ai) + typecheck — 가장 빠른 검사, 실패하면 뒤 작업을 돌리지 않는다
#   scripts     shellcheck(install.sh·start.sh·scripts/*.sh) + PowerShell 구문 검사(start.ps1·scripts/*.ps1)
#   test        pnpm test(단위: shared·web·server·site)
#   test-db     pnpm test:db(Testcontainers postgres:17 — 러너의 Docker를 쓴다)
#   build       pnpm build(shared → web → server, site 누출 검사 포함)
#   install     docker build → install.sh(빈 Linux 설치·승계 1~12·대사·DDL 회귀) → /health·/manual → 백업·복구
#
# E2E(Playwright)는 dev DB(RMS 33 테이블)·설치된 Chrome·Edge 채널을 전제로 하므로 로컬 게이트에 둔다(CR-13 C4).
name: ci

on:
  push:
    branches: [main, 'stage/**']
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TZ: Asia/Seoul

jobs:
  lint:
    name: lint · typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      # pnpm 버전은 루트 package.json의 packageManager(pnpm@10.33.0)를 따른다
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck

  scripts:
    name: 설치 스크립트 검사
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: shellcheck
        run: shellcheck install.sh start.sh scripts/*.sh
      - name: PowerShell 구문
        shell: pwsh
        run: |
          $bad = 0
          foreach ($f in @('start.ps1') + (Get-ChildItem scripts -Filter *.ps1).FullName) {
            $errs = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f), [ref]$null, [ref]$errs)
            if ($errs) { $bad++; $errs | ForEach-Object { Write-Host "::error file=$f,line=$($_.Extent.StartLineNumber)::$($_.Message)" } }
          }
          if ($bad) { exit 1 }

  test:
    name: test(단위)
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @termflow/shared build
      - run: pnpm test

  test-db:
    name: test:db(postgres:17)
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      # 실행마다 새 컨테이너(종료 시 삭제) — 러너는 매번 새 VM이라 재사용할 것이 없다
      TF_TEST_DB_REUSE: '0'
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @termflow/shared build
      - run: pnpm test:db

  build:
    name: build
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  install:
    name: 이미지 · Linux 설치
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - name: 이미지 태그(docker-compose.yml)
        id: tag
        run: |
          image="$(sed -nE 's/^[[:space:]]*image:[[:space:]]*(termflow-app:[^[:space:]]+).*/\1/p' docker-compose.yml | head -n1)"
          [ -n "$image" ] || { echo '::error::docker-compose.yml에서 termflow-app 이미지 태그를 찾지 못했습니다'; exit 1; }
          echo "image=$image" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: docker build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ steps.tag.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # 빈 서버 첫 설치와 같은 경로: .env 생성(난수) → db → 승계 1~12(대사·DDL 회귀 포함) → app healthy
      - name: install.sh
        run: ./install.sh --no-systemd --migrate yes --migrate-all
      - name: 접속 확인
        run: |
          curl -fsS http://localhost:7340/health
          echo
          curl -fsS -o /dev/null -w '/manual %{http_code}\n' http://localhost:7340/manual
      - name: 백업 · 복구
        run: |
          scripts/backup.sh
          dump="$(ls -1 backup/termflow_*.dump | head -n1)"
          scripts/restore.sh "$dump" --force
          curl -fsS http://localhost:7340/health
      - name: 실패 시 로그 모으기
        if: failure()
        run: |
          mkdir -p ci-logs
          docker compose ps -a > ci-logs/compose-ps.txt 2>&1 || true
          docker compose logs --no-color > ci-logs/compose.log 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: install-logs
          path: |
            ci-logs/
            logs/
            migration/report/
          if-no-files-found: ignore
          retention-days: 7
