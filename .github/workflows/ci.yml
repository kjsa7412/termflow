# TermFlow CI/CD(T13.1·CR-13, 개편 CR-17). 로컬 종료 게이트(TODO 원칙 1)의 자동 실행분을 GitHub Actions(ubuntu)로 돌리고,
# 판을 올린 main push면 검사 통과 뒤 배포물 실행(release.yml, 목록 제목 "v<판> 배포물")을 요청한다.
#
#   lint        pnpm lint(eslint·prettier·check:no-ai) + typecheck — 가장 빠른 검사, 실패하면 뒤 작업을 돌리지 않는다
#   scripts     shellcheck(install.sh·start.sh·scripts/*.sh) + PowerShell 구문 검사(start.ps1·scripts/*.ps1)
#   test        pnpm test(단위: shared·web·server·site)
#   test-db     pnpm test:db(Testcontainers postgres:17 — 러너의 Docker를 쓴다)
#   build       pnpm build(shared → web → server, site 누출 검사 포함)
#   install     docker build → install.sh(빈 Linux 설치·승계 1~12·대사·DDL 회귀) → /health·/manual → 백업·복구
#   version     (main push만) v<package.json version> 태그가 원격에 없으면 = 판을 올린 커밋 → 판 번호 일치 확인
#   release     version이 판 올림이라고 판단하고 위 검사가 모두 통과하면 release.yml 실행 요청(번들 → 번들만으로 설치 → 태그·Release 초안)
#
# 문서만 바꾼 push·PR은 돌지 않는다(CR-17 C2). 제품에 들어가는 문서(설명서 두 권·그림)는 예외로 돈다.
# E2E(Playwright)는 dev DB(RMS 33 테이블)·설치된 Chrome·Edge 채널을 전제로 하므로 로컬 게이트에 둔다(CR-13 C4).
name: ci

# paths는 위에서 아래로 적용된다: 모두 → docs·루트 .md·개발 도구 폴더 제외 → 제품 내 설명서 원천(.dockerignore 예외와 같음)은 다시 포함
# 대괄호는 check:no-ai 문자열 검사를 피하려는 glob 표기(.dockerignore와 같음)
on:
  push:
    branches: [main, 'stage/**']
    paths:
      - '**'
      - '!docs/**'
      - '!*.md'
      - '!.[cC]laude/**'
      - 'docs/사용자_가이드.md'
      - 'docs/설치_운영_가이드.md'
      - 'docs/img/**'
      - 'docs/skills/**'
  pull_request:
    branches: [main]
    paths:
      - '**'
      - '!docs/**'
      - '!*.md'
      - '!.[cC]laude/**'
      - 'docs/사용자_가이드.md'
      - 'docs/설치_운영_가이드.md'
      - 'docs/img/**'
      - 'docs/skills/**'
  workflow_dispatch:

# 브랜치·PR은 새 push가 오면 앞 실행을 취소한다. main은 취소하지 않고 순서대로 돈다 — 배포물을 만드는 중에 끊기지 않게(CR-17 C5)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  TZ: Asia/Seoul

jobs:
  lint:
    name: lint · typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # pnpm 버전은 루트 package.json의 packageManager(pnpm@10.33.0)를 따른다
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck

  scripts:
    name: 설치 스크립트 검사
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck
        run: shellcheck install.sh start.sh scripts/*.sh
      - name: PowerShell 구문
        shell: pwsh
        run: |
          $bad = 0
          foreach ($f in @('start.ps1') + (Get-ChildItem scripts -Filter *.ps1).FullName) {
            $errs = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f), [ref]$null, [ref]$errs)
            if ($errs) { $bad++; $errs | ForEach-Object { Write-Host "::error file=$f,line=$($_.Extent.StartLineNumber)::$($_.Message)" } }
          }
          if ($bad) { exit 1 }

  test:
    name: test(단위)
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @termflow/shared build
      - run: pnpm test

  test-db:
    name: test:db(postgres:17)
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      # 실행마다 새 컨테이너(종료 시 삭제) — 러너는 매번 새 VM이라 재사용할 것이 없다
      TF_TEST_DB_REUSE: '0'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @termflow/shared build
      - run: pnpm test:db

  build:
    name: build
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  install:
    name: 이미지 · Linux 설치
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - name: 이미지 태그(docker-compose.yml)
        id: tag
        run: |
          image="$(sed -nE 's/^[[:space:]]*image:[[:space:]]*(termflow-app:[^[:space:]]+).*/\1/p' docker-compose.yml | head -n1)"
          [ -n "$image" ] || { echo '::error::docker-compose.yml에서 termflow-app 이미지 태그를 찾지 못했습니다'; exit 1; }
          echo "image=$image" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - name: docker build
        uses: docker/build-push-action@v7
        env:
          # 빌드 기록(.dockerbuild) 산출물은 올리지 않는다 — 요약은 작업 화면에 남는다(CR-14 C9)
          DOCKER_BUILD_RECORD_UPLOAD: 'false'
        with:
          context: .
          load: true
          tags: ${{ steps.tag.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # 빈 서버 첫 설치와 같은 경로: .env 생성(난수) → db → 승계 1~12(대사·DDL 회귀 포함) → app healthy
      - name: install.sh
        run: ./install.sh --no-systemd --migrate yes --migrate-all
      - name: 접속 확인
        run: |
          curl -fsS http://localhost:7340/health
          echo
          curl -fsS -o /dev/null -w '/manual %{http_code}\n' http://localhost:7340/manual
      - name: 백업 · 복구
        run: |
          scripts/backup.sh
          dump="$(ls -1 backup/termflow_*.dump | head -n1)"
          scripts/restore.sh "$dump" --force
          # restore.sh는 app 기동 요청까지만 한다(healthy 대기 없음) — 기동(약 수십 초)을 재시도로 기다린다
          curl -fsS --retry 45 --retry-delay 2 --retry-all-errors http://localhost:7340/health
      - name: 실패 시 로그 모으기
        if: failure()
        run: |
          mkdir -p ci-logs
          docker compose ps -a > ci-logs/compose-ps.txt 2>&1 || true
          docker compose logs --no-color > ci-logs/compose.log 2>&1 || true
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: install-logs
          path: |
            ci-logs/
            logs/
            migration/report/
          if-no-files-found: ignore
          retention-days: 7

  # 판 번호의 원천은 package.json "version" 하나다(CR-14 C11). 태그가 이미 있으면 평소 커밋 — release를 건너뛴다.
  # 판을 올렸는데 package.json·compose·릴리스 노트가 어긋나면 여기서 바로 실패한다(검사를 기다리지 않음).
  version:
    name: 판 확인
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      release: ${{ steps.check.outputs.release }}
      tag: ${{ steps.check.outputs.tag }}
      sha: ${{ steps.bump.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          # 판 올림 커밋을 찾으려고 최근 이력을 받는다(그보다 오래되면 push 끝 커밋으로 대신한다)
          fetch-depth: 50
      - name: v<version> 태그 확인
        id: check
        run: |
          ver="$(sed -nE 's/^[[:space:]]*"version":[[:space:]]*"([^"]+)".*/\1/p' package.json | head -n1)"
          echo "tag=v$ver" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$ver" >/dev/null; then
            echo "v$ver 태그가 이미 있습니다 — 판을 올린 커밋이 아니므로 배포물을 만들지 않습니다"
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            scripts/release-check.sh "v$ver"
            echo "v$ver 태그가 없습니다 — 검사가 모두 통과하면 배포물을 만듭니다"
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi
      # 태그(커밋 목록의 판 표시)는 판을 올린 커밋에 단다(CR-17 C8). 판 올림 뒤에 같이 push한 커밋이
      # 제품과 무관한 문서뿐이면 판 올림 커밋, 제품 파일이 바뀌었으면 검사한 push 끝 커밋 — scripts/release-commit.sh
      - name: 판 올림 커밋
        id: bump
        if: ${{ steps.check.outputs.release == 'true' }}
        run: echo "sha=$(scripts/release-commit.sh HEAD | tail -n1)" >> "$GITHUB_OUTPUT"

  # 배포물은 release.yml의 별도 실행으로 시작한다 — Actions 목록에 "v<판> 배포물"로 따로 보이게(CR-17 C7).
  # GITHUB_TOKEN으로 만든 이벤트 중 workflow_dispatch는 새 실행을 만든다(태그 push는 만들지 않음)
  release:
    name: 배포물 요청
    needs: [version, lint, scripts, test, test-db, build, install]
    if: ${{ needs.version.outputs.release == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.version.outputs.tag }}
      SHA: ${{ needs.version.outputs.sha }}
    steps:
      - name: release.yml 실행
        run: |
          gh workflow run release.yml -R "$GITHUB_REPOSITORY" --ref main -f tag="$TAG" -f sha="$SHA"
          echo "$TAG 배포물 실행을 요청했습니다 — Actions 목록의 \"$TAG 배포물\"에서 진행을 봅니다"
