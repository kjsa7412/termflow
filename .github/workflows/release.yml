# TermFlow 배포물(CD, T14.1·CR-14, 개편 CR-17). 판 번호 확인 → Linux 오프라인 번들 → 번들만으로 설치 확인 → 태그·GitHub Release 초안.
#
#   meta     판 번호 일치(scripts/release-check.sh): package.json version = docker-compose.yml termflow-app:X.Y.Z, 릴리스 노트 있음
#   bundle   docker build → scripts/bundle.sh → 이미지를 지운 뒤 번들을 새 폴더에 풀어 install.sh(images/ docker load만) → healthy
#   publish  태그 vX.Y.Z가 없으면 그 커밋에 만든다 → Release 초안(draft)에 termflow-linux-X.Y.Z.tar.gz·.sha256 첨부, 본문 = 릴리스 노트.
#            게시는 사람이 확인한 뒤 한다
#
# 시작 경로 두 가지(CR-17 C3·C7). 어느 쪽이든 Actions 목록에 판이 앞에 붙은 제목으로 따로 보인다:
#   ① 자동(기본) — 판을 올린 main push의 ci.yml이 검사를 모두 통과하면 "배포물 요청" 작업이 tag·sha를 넣어 실행한다
#      → 목록 제목 "v1.2.2 배포물"
#   ② 수동 — Actions › release › Run workflow(tag만 입력, sha는 비움). 이미 있는 태그로 배포물을 다시 만든다
#      (검사는 그 태그의 ci가 이미 통과) → 목록 제목 "v1.2.1 배포물 다시 만들기"
# 태그는 번들 검증이 끝난 뒤에 만든다 — 번들이 실패하면 태그가 없어 다음 main push가 다시 시도한다.
# 저장소·Release는 비공개로 둔다 — 번들에 승계 원본(seed/original)이 들어 있다(CR-14 C7).
name: release
run-name: ${{ inputs.tag }} 배포물${{ inputs.sha == '' && ' 다시 만들기' || '' }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 버전 태그(예 v1.2.2). sha를 비우면 원격에 이미 있는 태그로 배포물을 다시 만든다
        required: true
        type: string
      sha:
        description: 배포물을 만들 커밋(자동 실행이 넣는다. 수동이면 비운다)
        required: false
        type: string
        default: ''

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  TZ: Asia/Seoul
  # 자동이면 커밋, 수동이면 태그를 꺼내 쓴다
  REF: ${{ inputs.sha || format('refs/tags/{0}', inputs.tag) }}

jobs:
  meta:
    name: 판 번호 확인
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.check.outputs.tag }}
      ver: ${{ steps.check.outputs.ver }}
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.REF }}
      - id: check
        # 입력 태그 = package.json 판 = compose 이미지 태그, 릴리스 노트 있음
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: scripts/release-check.sh "$INPUT_TAG"
      - id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  bundle:
    name: 번들 · 오프라인 설치 확인
    needs: meta
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      VER: ${{ needs.meta.outputs.ver }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.meta.outputs.sha }}
      - uses: docker/setup-buildx-action@v4
      - name: docker build
        uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_RECORD_UPLOAD: 'false'
        with:
          context: .
          load: true
          tags: termflow-app:${{ needs.meta.outputs.ver }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: bundle.sh
        run: |
          docker image inspect --format '{{.Id}}' "termflow-app:$VER" > "$RUNNER_TEMP/app-image-id"
          scripts/bundle.sh --out "$GITHUB_WORKSPACE/release"
          ls -l release
      # 서버와 같은 조건: 레지스트리·소스 빌드 없이 번들 안 images/만으로 설치되는지 본다
      - name: 번들만으로 설치
        run: |
          docker image rm "termflow-app:$VER" postgres:17
          dest="$RUNNER_TEMP/opt-termflow"
          mkdir -p "$dest"
          tar -xzf "release/termflow-linux-$VER.tar.gz" -C "$dest" --strip-components=1
          "$dest/install.sh" --no-systemd --migrate no
          loaded="$(docker image inspect --format '{{.Id}}' "termflow-app:$VER")"
          [ "$loaded" = "$(cat "$RUNNER_TEMP/app-image-id")" ] || { echo '::error::설치에 쓴 이미지가 번들의 이미지가 아닙니다(다시 빌드됨)'; exit 1; }
          curl -fsS --retry 45 --retry-delay 2 --retry-all-errors http://localhost:7340/health
          echo
          curl -fsS -o /dev/null -w '/manual %{http_code}\n' http://localhost:7340/manual
      - name: 릴리스 노트
        run: |
          mkdir -p notes
          cp "docs/릴리스_노트_v$VER.md" notes/notes.md
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ needs.meta.outputs.tag }}
          path: |
            release/termflow-linux-${{ needs.meta.outputs.ver }}.tar.gz
            release/termflow-linux-${{ needs.meta.outputs.ver }}.tar.gz.sha256
            notes/notes.md
          # 이미 gzip이라 다시 압축하지 않는다. Release로 옮기기 위한 잠깐 보관
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  publish:
    name: 태그 · Release 초안
    needs: [meta, bundle]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.meta.outputs.tag }}
      VER: ${{ needs.meta.outputs.ver }}
      SHA: ${{ needs.meta.outputs.sha }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-${{ needs.meta.outputs.tag }}
      # 태그는 손으로 달지 않는다(CR-14 C11). 수동 실행이면 태그가 이미 있어 건너뛴다
      - name: 태그
        run: |
          if gh api "repos/$GH_REPO/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "$TAG 태그가 이미 있습니다"
          else
            gh api "repos/$GH_REPO/git/refs" -f ref="refs/tags/$TAG" -f sha="$SHA" --jq '.ref'
            echo "$TAG → ${SHA:0:7}"
          fi
      - name: GitHub Release
        run: |
          files=("release/termflow-linux-$VER.tar.gz" "release/termflow-linux-$VER.tar.gz.sha256")
          (cd release && sha256sum -c "termflow-linux-$VER.tar.gz.sha256")
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "같은 판의 Release가 있습니다 — 파일만 바꿔 올립니다"
            gh release upload "$TAG" "${files[@]}" --clobber
          else
            gh release create "$TAG" "${files[@]}" --draft --verify-tag \
              --title "TermFlow $TAG" --notes-file notes/notes.md
          fi
          gh release view "$TAG" --json url,isDraft,assets --jq '"\(.url) draft=\(.isDraft) assets=\([.assets[].name] | join(", "))"'
