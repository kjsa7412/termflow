<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TermFlow — 용어에서 DDL까지, 끊김 없는 한 흐름</title>
    <meta
      name="description"
      content="표준 용어로 컬럼을 자동완성해 테이블을 설계하고 PostgreSQL DDL까지 만드는 다중 사용자·프로젝트 기반 데이터 표준 설계 서비스."
    />
    <meta property="og:type" content="website" />

      property="og:description"
      content="표준 용어로 컬럼을 자동완성해 테이블을 설계하고 PostgreSQL DDL까지 만드는 데이터 표준 설계 서비스."
    />
    <meta name="theme-color" content="#4f46e5" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
    />
    <!-- 테마: 저장값 > 시스템 설정. 그리기 전에 정해 깜빡임을 막는다 -->
    <script>
      try {
        var t = localStorage.getItem('tf-site-theme');
        if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
