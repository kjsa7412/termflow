# TermFlow 실행 구성(설계서 부록 B.1 db + B.3 N안 app, T11.2). 값은 같은 디렉터리의 .env에서 읽는다(.env.example 참고).
#
# 운영 기본값: 프로젝트 termflow, 컨테이너 termflow-db/termflow-app, 호스트 포트 app 7340 · db 7341(흔한 서비스 기본값과 겹치지 않게, CR-12 C16).
# 같은 PC에서 두 번째 인스턴스(검증 등)를 띄울 때는 .env 또는 환경 변수로 바꾼다(CR-11a C3):
#   COMPOSE_PROJECT_NAME(볼륨 이름 접두어도 바뀜) · TERMFLOW_DB_CONTAINER · TERMFLOW_APP_CONTAINER · TERMFLOW_DB_PORT · TERMFLOW_APP_PORT
name: termflow

services:
  db:
    image: postgres:17
    container_name: ${TERMFLOW_DB_CONTAINER:-termflow-db}
    restart: unless-stopped
    environment:
      POSTGRES_DB: termflow
      POSTGRES_USER: termflow
      POSTGRES_PASSWORD: ${TERMFLOW_DB_PASSWORD:?required}
      TZ: Asia/Seoul
    ports: ['${TERMFLOW_DB_PORT:-7341}:5432']
    volumes:
      - termflow-pgdata:/var/lib/postgresql/data
      - ./seed:/seed:ro # migrate 단계 psql 적재용(읽기 전용)
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U termflow -d termflow']
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build:
      context: .
      dockerfile: Dockerfile # §2.5.8 멀티스테이지(node:22-alpine)
    image: termflow-app:1.3.1
    container_name: ${TERMFLOW_APP_CONTAINER:-termflow-app}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    # 비밀값(TERMFLOW_DB_PASSWORD·TERMFLOW_ADMIN_PASSWORD·TERMFLOW_SESSION_SECRET)은 env_file로 들어오고
    # production 필수 검증은 서버(env.schema.ts)와 start.ps1이 한다. 여기서 :?required로 막으면 개발용
    # `docker compose up -d db`까지 실패하므로 두지 않는다.
    # 아래 값은 env_file(.env)보다 우선한다. 컨테이너 안 경로·접속 대상은 이미지 배치에 고정(CR-11a C1·C2).
    environment:
      NODE_ENV: production
      PORT: '8080'
      TERMFLOW_DB_URL: postgres://db:5432/termflow
      TERMFLOW_DB_USER: termflow
      TERMFLOW_LEGACY_DUMP: /seed/original/dump-gen_table-new.sql
      TERMFLOW_REPORT_DIR: /app/migration/report
      TZ: Asia/Seoul
    ports: ['${TERMFLOW_APP_PORT:-7340}:8080']
    volumes:
      - ./logs:/app/logs # pino-roll 일 단위 30개(§12.3, T11.5)
      - ./migration/report:/app/migration/report # 승계 리포트(§11.3)
      - ./seed:/seed:ro # 승계 원본 dump(읽기 전용)
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8080/health']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    # stdout JSON 로그(docker logs)는 파일 로그와 중복이므로 크기를 제한한다(T11.5)
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

volumes:
  termflow-pgdata:
